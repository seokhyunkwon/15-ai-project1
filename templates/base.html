<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}AI 취업 뉴스 분석{% endblock %}</title>

    <style>
      * { box-sizing: border-box; }

      :root {
        --bg: #f4f6f8;
        --panel: #ffffff;
        --line: #dfe6ed;
        --line-strong: #c9d4df;
        --text: #17202a;
        --muted: #667585;
        --brand: #1769e0;
        --brand-dark: #1151ae;
        --soft-blue: #f0f6ff;
        --soft-green: #eefaf7;
        --soft-orange: #fff7ed;
      }

      body {
        margin: 0;
        font-family: Arial, "Noto Sans KR", sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      a {
        color: var(--brand);
        font-weight: 700;
        text-decoration: none;
      }

      a:hover { text-decoration: underline; }

      button, input, textarea { font: inherit; }
      button { cursor: pointer; }

      input, textarea {
        width: 100%;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        background: #ffffff;
        color: var(--text);
        font-size: 14px;
      }

      input { height: 44px; padding: 0 13px; }
      input[type="hidden"] { display: none; }
      textarea { min-height: 76px; padding: 12px 13px; resize: vertical; }

      input:focus, textarea:focus {
        border-color: var(--brand);
        outline: 3px solid rgba(23, 105, 224, 0.12);
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: keep-all;
        overflow-wrap: anywhere;
        font-family: inherit;
        color: #334150;
        line-height: 1.65;
      }

      .app-shell { min-height: 100vh; }
      .top-nav { background: #ffffff; border-bottom: 1px solid var(--line); }

      .nav-inner, .hero-inner, .content {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
      }

      .nav-inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 66px;
      }

      .brand-mark {
        display: flex;
        gap: 10px;
        align-items: center;
        font-weight: 900;
        font-size: 20px;
      }

      .brand-dot {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 7px;
        color: #ffffff;
        background: var(--brand);
        font-size: 13px;
      }

      .nav-meta { color: #334155; font-size: 15px; font-weight: 700; }

      .hero {
        background:
          linear-gradient(90deg, rgba(0, 0, 0, 0.72) 0%, rgba(0, 0, 0, 0.45) 44%, rgba(0, 0, 0, 0.12) 100%),
          url("{{ url_for('static', filename='hero-road-no-text.png') }}") center / cover no-repeat;
        border-bottom: 1px solid var(--line);
        color: #ffffff;
      }

      .hero-inner {
        min-height: 680px;
        display: flex;
        align-items: center;
        padding: 52px 0;
      }

      .hero-grid {
        display: grid;
        width: 100%;
        grid-template-columns: minmax(0, 0.95fr) minmax(390px, 0.72fr);
        gap: 46px;
        align-items: center;
      }

      .hero-copy h1 {
        max-width: 640px;
        margin: 0 0 18px;
        font-size: 58px;
        line-height: 1.12;
      }

      .hero-copy p {
        max-width: 560px;
        margin: 0;
        color: rgba(255, 255, 255, 0.88);
        font-size: 18px;
        line-height: 1.7;
      }

      .mini-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        max-width: 620px;
        margin-top: 28px;
      }

      .mini-stat {
        padding: 14px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
      }

      .mini-stat strong { display: block; font-size: 22px; }
      .mini-stat span { display: block; margin-top: 4px; color: rgba(255, 255, 255, 0.82); font-size: 13px; }

      .search-card {
        padding: 24px;
        border: 1px solid rgba(255, 255, 255, 0.36);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.2);
        color: var(--text);
      }

      .search-card h2 { margin: 0 0 16px; font-size: 22px; }

      .search-panel {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .field-wide { grid-column: 1 / -1; }

      .primary-button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        background: var(--brand);
        font-weight: 800;
      }

      .primary-button:hover { background: var(--brand-dark); }

      .content { padding: 34px 0 56px; }

      .section-head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-end;
        margin-bottom: 16px;
      }

      .section-head h2 { margin: 0; font-size: 25px; }
      .section-head p { margin: 7px 0 0; color: var(--muted); line-height: 1.6; }

      .featured-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 22px;
      }

      .featured-form { margin: 0; }

      .company-card {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        width: 100%;
        min-height: 86px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        text-align: left;
      }

      .company-card:hover { border-color: var(--brand); box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08); }
      .company-name { display: block; font-size: 18px; font-weight: 900; }
      .company-desc { display: block; margin-top: 5px; color: var(--muted); font-size: 13px; }
      .card-action { flex: 0 0 auto; color: var(--brand); font-weight: 800; font-size: 13px; }

      .result-bar {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-end;
        margin: 0 0 14px;
      }

      .result-count { font-weight: 800; }
      .hint { margin: 0; color: var(--muted); font-size: 14px; }

      .company-summary {
        margin-bottom: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
      }

      .company-summary {
        padding: 22px;
      }

      .company-summary-head {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: flex-start;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        display: inline-flex;
        margin-bottom: 8px;
        color: var(--brand);
        font-size: 13px;
        font-weight: 900;
      }

      .company-summary h2 {
        margin: 0;
        font-size: 23px;
      }

      .company-summary p {
        margin: 8px 0 0;
        color: #4b5c6b;
        line-height: 1.65;
      }

      .company-summary-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        padding-top: 18px;
      }

      .company-summary-grid div {
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fafc;
      }

      .company-summary-grid h3 {
        margin: 0;
        font-size: 15px;
      }

      .company-summary-grid p {
        font-size: 14px;
      }

      .support-strategy {
        margin-top: 18px;
        padding: 16px;
        border: 1px solid #bfdbfe;
        border-radius: 8px;
        background: var(--soft-blue);
      }

      .support-strategy h3 {
        margin: 0;
        font-size: 16px;
      }

      .support-strategy ul {
        margin: 12px 0 0;
        padding-left: 20px;
        color: #334150;
        line-height: 1.7;
      }

      .filter-tabs {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .filter-tab {
        min-height: 34px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        padding: 7px 12px;
        color: #475569;
        background: #ffffff;
        font-size: 13px;
        font-weight: 800;
      }

      .filter-tab.is-active {
        border-color: var(--brand);
        color: #ffffff;
        background: var(--brand);
      }

      .news-list { display: grid; gap: 16px; }

      .news-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }

      .article-head { padding: 22px 24px 16px; border-bottom: 1px solid var(--line); }
      .article-head h2 { margin: 0 0 12px; font-size: 21px; line-height: 1.42; }

      .meta { display: flex; flex-wrap: wrap; gap: 8px; }
      .tag { border: 1px solid #d6e0e8; border-radius: 999px; padding: 5px 9px; color: #52616f; background: #f8fafc; font-size: 13px; }
      .tag-warning { border-color: #fbbf24; color: #92400e; background: #fffbeb; }
      .tag-category { border-color: #bfdbfe; color: #1d4ed8; background: #eff6ff; }

      .article-body { padding: 18px 24px 24px; }
      .summary { margin: 0 0 14px; color: #374553; line-height: 1.7; }

      .article-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }

      .source-link, .retry-link {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 14px;
      }

      .source-link { color: #ffffff; background: var(--brand); }
      .source-link:hover { color: #ffffff; background: var(--brand-dark); text-decoration: none; }
      .retry-link { border: 1px solid #f59e0b; color: #92400e; background: #fffbeb; }

      .strategy {
        margin-top: 18px;
        padding: 15px 16px;
        border-left: 5px solid #ea580c;
        background: var(--soft-orange);
      }

      .spotlight-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-top: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }

      .spotlight-panel { padding: 16px; border-right: 1px solid var(--line); background: #ffffff; }
      .spotlight-panel:nth-child(2) { background: var(--soft-blue); }
      .spotlight-panel:nth-child(3) { border-right: 0; background: var(--soft-green); }

      .analysis-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-top: 16px;
        border-top: 1px solid var(--line);
        border-left: 1px solid var(--line);
      }

      .analysis-section {
        min-height: 130px;
        padding: 16px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: #ffffff;
      }

      .analysis-section:nth-child(2), .analysis-section:nth-child(5) { background: #f8fbff; }
      .analysis-section:nth-child(3), .analysis-section:nth-child(6) { background: #fffaf2; }

      .strategy h3, .spotlight-panel h3, .analysis-section h3, .legacy h3, .compact-row h3 {
        margin: 0 0 8px;
        font-size: 15px;
      }

      .analysis-alert {
        margin-top: 16px;
        padding: 13px 14px;
        border: 1px solid #fde68a;
        border-radius: 8px;
        color: #854d0e;
        background: #fffbeb;
        line-height: 1.6;
      }

      .readability-panel {
        margin-top: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        overflow: hidden;
      }

      .readability-panel > summary {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding: 15px 16px;
        font-weight: 800;
        list-style: none;
        cursor: pointer;
      }

      .readability-panel > summary::-webkit-details-marker { display: none; }
      .readability-panel > summary::after {
        content: "+";
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        color: var(--brand);
        background: var(--soft-blue);
        font-weight: 900;
      }

      .readability-panel[open] > summary::after { content: "-"; }
      .readability-panel .analysis-grid, .readability-panel .spotlight-grid { margin-top: 0; border-left: 0; }
      .readability-panel .analysis-grid { border-top: 1px solid var(--line); }

      .compact-list { display: grid; gap: 12px; margin-top: 16px; }

      .compact-row {
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr);
        gap: 14px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
      }

      .legacy { margin-top: 16px; padding: 16px; border: 1px dashed #b8c6d1; border-radius: 8px; background: #f8fafc; }

      .empty-state {
        padding: 46px 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        text-align: center;
        color: var(--muted);
        background: var(--panel);
      }

      .error-state {
        margin-bottom: 16px;
        padding: 14px 16px;
        border: 1px solid #fecaca;
        border-radius: 8px;
        color: #991b1b;
        background: #fff1f2;
        line-height: 1.6;
      }

      .is-loading { opacity: 0.72; pointer-events: none; }

      .loading-card {
        display: grid;
        place-items: center;
        gap: 14px;
        min-height: 420px;
        padding: 42px 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        text-align: center;
        background: #ffffff;
      }

      .loading-card h1 { margin: 0; font-size: 25px; }
      .loading-card p { margin: 0; color: var(--muted); }

      .loading-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #dbeafe;
        border-top-color: var(--brand);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      @media (max-width: 920px) {
        .hero-inner { min-height: auto; padding: 44px 0; }
        .hero-grid { grid-template-columns: 1fr; gap: 28px; }
        .hero-copy h1 { font-size: 44px; }
        .featured-grid,
        .spotlight-grid,
        .company-summary-grid {
          grid-template-columns: 1fr;
        }

        .company-summary-head {
          flex-direction: column;
        }

        .spotlight-panel { border-right: 0; border-bottom: 1px solid var(--line); }
        .spotlight-panel:nth-child(3) { border-bottom: 0; }
      }

      @media (max-width: 680px) {
        .nav-inner, .hero-inner, .content { width: min(100% - 24px, 1180px); }
        .nav-meta { display: none; }
        .hero-copy h1 { font-size: 34px; }
        .mini-stats, .search-panel, .analysis-grid, .compact-row { grid-template-columns: 1fr; }
        .section-head, .result-bar { align-items: stretch; flex-direction: column; }
        .article-head, .article-body { padding-left: 16px; padding-right: 16px; }
      }
    </style>
  </head>

  <body>
    <div class="app-shell">
      <nav class="top-nav">
        <div class="nav-inner">
          <div class="brand-mark">
            <span class="brand-dot">AI</span>
            <span>Career News Lab</span>
          </div>
          <div class="nav-meta">자동차 산업 취업 뉴스 분석</div>
        </div>
      </nav>

      {% block body %}{% endblock %}
    </div>

    <script>
      document.addEventListener("submit", function (event) {
        const button = event.target.querySelector("button[type='submit']");

        if (!button) {
          return;
        }

        button.classList.add("is-loading");
        button.dataset.originalText = button.textContent;
        button.textContent = "분석 중...";
      });

      document.addEventListener("click", function (event) {
        const tab = event.target.closest("[data-filter]");

        if (!tab) {
          return;
        }

        const filter = tab.dataset.filter;
        const tabs = document.querySelectorAll("[data-filter]");
        const cards = document.querySelectorAll(".news-card[data-category]");
        const empty = document.querySelector(".is-filter-empty");
        let visibleCount = 0;

        tabs.forEach(function (item) {
          item.classList.toggle("is-active", item === tab);
        });

        cards.forEach(function (card) {
          const isVisible = filter === "all" || card.dataset.category === filter;
          card.hidden = !isVisible;

          if (isVisible) {
            visibleCount += 1;
          }
        });

        if (empty) {
          empty.hidden = visibleCount !== 0;
        }
      });
    </script>
  </body>
</html>
