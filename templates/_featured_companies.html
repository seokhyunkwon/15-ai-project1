<section>
  <div class="section-head">
    <div>
      <h2>추천 기업 바로 분석</h2>
      <p>자주 보는 자동차 기업은 클릭 한 번으로 관련 뉴스만 모아 분석합니다.</p>
    </div>
  </div>

  <div class="featured-grid">
    {% for company in featured_companies %}
    <form class="featured-form" method="GET" action="{{ url_for('results') }}">
      <input type="hidden" name="keyword" value="{{ company.keyword }}" />
      <input type="hidden" name="target_job" value="{{ user_profile.target_job }}" />
      <input type="hidden" name="major" value="{{ user_profile.major }}" />
      <input type="hidden" name="certificates" value="{{ user_profile.certificates }}" />
      <input type="hidden" name="experience" value="{{ user_profile.experience }}" />
      <input type="hidden" name="strengths" value="{{ user_profile.strengths }}" />

      <button class="company-card" type="submit">
        <span>
          <span class="company-name">{{ company.label }}</span>
          <span class="company-desc">{{ company.description }}</span>
        </span>
        <span class="card-action">바로 분석</span>
      </button>
    </form>
    {% endfor %}
  </div>
</section>
